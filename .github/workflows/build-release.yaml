name: Build & Release winutil-cn

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # NOTE: keep all `run:` script bodies pure ASCII. GitHub Actions writes them to
      # temp .ps1 files as UTF-8 without BOM; Windows PowerShell 5.1 reads them with
      # the system ANSI codepage, so any non-ASCII character breaks parsing.
      - name: Run core tests (Pester 5+)
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck -MinimumVersion 5.5.0
          Import-Module Pester -MinimumVersion 5.0.0
          $r = Invoke-Pester -Path pester\configs.Tests.ps1, pester\tweaks.Tests.ps1, pester\xaml.Tests.ps1, pester\sanity.Tests.ps1 -PassThru -Output Normal
          if ($r.FailedCount -gt 0) { throw "Pester failed: $($r.FailedCount) tests" }

      - name: Compile winutil.ps1 (Windows PowerShell 5.1 keeps UTF-8 BOM output)
        shell: powershell
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          ./Compile.ps1
          if (-not (Test-Path winutil.ps1)) { throw "Compile output missing" }
          $b = [System.IO.File]::ReadAllBytes((Resolve-Path winutil.ps1))
          if (-not ($b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)) { throw "winutil.ps1 missing UTF-8 BOM" }
          $tokens = $null; $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path winutil.ps1), [ref]$tokens, [ref]$errs) | Out-Null
          if ($errs.Count -gt 0) { throw "Compiled winutil.ps1 has $($errs.Count) syntax errors" }

      - name: Upload compiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: winutil-cn
          path: winutil.ps1
          if-no-files-found: error

      - name: Publish Release (only when a v* tag is pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: winutil.ps1
          name: winutil-cn ${{ github.ref_name }}
          body: |
            ## winutil-cn ${{ github.ref_name }}

            Windows 开发者工具箱中文增强版（基于 ChrisTitusTech/winutil）。

            ### 本分支特色
            - 界面全面汉化（页签/分类树/设置/配置页等）
            - 新增 OpenJDK 17 (Temurin LTS) 与 Apache Maven 安装项
            - 「开发环境配置」：npm/pip/Maven 国内镜像、Git 全局配置、VS Code 常用扩展（可一键撤销）
            - 支持 installLocation 自定义安装目录

            ### 使用方法
            以管理员身份打开 PowerShell，执行：
            ```powershell
            Set-ExecutionPolicy Bypass -Scope Process
            .\winutil.ps1
            ```
            或直接下载本 Release 的 `winutil.ps1` 运行。
